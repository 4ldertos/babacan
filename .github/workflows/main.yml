name: Xray + Cloudflared Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Kurulum
      run: |
        sudo apt update -qq
        sudo apt install -y -qq curl wget unzip jq

    - name: Xray Binary İndir
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -O Xray.zip
        unzip -oq Xray.zip
        chmod +x xray
        sudo mv xray /usr/local/bin/
        xray version

    - name: Xray Config ve Başlat
      run: |
        UUID=$(cat /proc/sys/kernel/random/uuid)
        echo "UUID=$UUID" >> $GITHUB_ENV
        echo "✅ UUID: $UUID"

        cat << EOF > config.json
        {
          "log": {"loglevel": "warning"},
          "policy": {
            "levels": {
              "0": {
                "bufferSize": 4,
                "handshake": 10,
                "connIdle": 120
              }
            },
            "system": {
              "statsInboundUplink": false,
              "statsInboundDownlink": false
            }
          },
          "inbounds": [{
            "port": 10000,
            "listen": "127.0.0.1",
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "${UUID}"}],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": {"path": "/"}
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF

        export GOGC=50
        export GOMEMLIMIT=400MiB
        nohup xray run -config config.json > xray.log 2>&1 &
        sleep 3
        echo "✅ Xray başlatıldı"
        cat xray.log

    - name: Cloudflared Kur
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
        chmod +x cloudflared
        sudo mv cloudflared /usr/local/bin/
        cloudflared --version

    - name: Cloudflared Tunnel Başlat (HTTP2)
      run: |
        : > tunnel.log
        nohup cloudflared tunnel --url http://127.0.0.1:10000 --protocol http2 > tunnel.log 2>&1 &

        echo "⏳ Cloudflared başlatılıyor..."
        sleep 20

        TUNNEL_URL=$(grep -ao 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)

        if [ -z "$TUNNEL_URL" ]; then
          echo "❌ URL bulunamadı! Loglar:"
          cat tunnel.log
          exit 1
        fi

        echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        echo "✅ Tunnel URL: $TUNNEL_URL"

    - name: VLESS URL Oluştur
      run: |
        UUID="${{ env.UUID }}"
        TUNNEL_URL="${{ env.TUNNEL_URL }}"
        HOST=$(echo "$TUNNEL_URL" | sed 's|https://||')
        VLESS_URL="vless://${UUID}@${HOST}:443?path=/&security=tls&encryption=none&host=${HOST}&type=ws#Xray-Tunnel"
        echo "VLESS_URL=$VLESS_URL" >> $GITHUB_ENV
        ENCODED=$(echo -n "$VLESS_URL" | base64 -w 0)
        echo "ENCODED=$ENCODED" >> $GITHUB_ENV
        echo "$VLESS_URL" > vless-url.txt
        echo "$TUNNEL_URL" > tunnel-url.txt

        echo "=========================================="
        echo "✅ VLESS URL OLUŞTURULDU!"
        echo "=========================================="
        echo "🔗 Tunnel: $TUNNEL_URL"
        echo "📱 VLESS:  $VLESS_URL"
        echo "📱 QR:     https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=$ENCODED"
        echo "=========================================="

    - name: Artifacts Yükle
      uses: actions/upload-artifact@v4
      with:
        name: xray-config
        path: |
          vless-url.txt
          tunnel-url.txt
        retention-days: 7

    - name: Tunnel'ı Canlı Tut (Otomatik Restart)
      run: |
        echo "⏳ Çalışıyor..."
        while true; do
          sleep 60

          # Cloudflared kontrol + restart
          if ! pgrep -f "cloudflared tunnel" > /dev/null; then
            echo "❌ Cloudflared durdu! Yeniden başlatılıyor..."
            : > tunnel.log
            nohup cloudflared tunnel --url http://127.0.0.1:10000 --protocol http2 > tunnel.log 2>&1 &
            sleep 20
            NEW_URL=$(grep -ao 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            if [ -n "$NEW_URL" ]; then
              echo "🔄 Yeni Tunnel URL: $NEW_URL"
              HOST=$(echo "$NEW_URL" | sed 's|https://||')
              VLESS_URL="vless://${{ env.UUID }}@${HOST}:443?path=/&security=tls&encryption=none&host=${HOST}&type=ws#Xray-Tunnel"
              echo "🔄 Yeni VLESS: $VLESS_URL"
              echo "$VLESS_URL" > vless-url.txt
              echo "$NEW_URL" > tunnel-url.txt
            fi
          fi

          # Xray kontrol + restart
          if ! pgrep -f "xray run" > /dev/null; then
            echo "❌ Xray durdu! Yeniden başlatılıyor..."
            export GOGC=50
            export GOMEMLIMIT=400MiB
            nohup xray run -config config.json > xray.log 2>&1 &
            sleep 3
          fi

          # Kaynak logu
          XRAY_PID=$(pgrep -f "xray run" | head -1)
          if [ -n "$XRAY_PID" ]; then
            echo "[$(date +%H:%M)] Xray CPU/RAM: $(ps -o pcpu,pmem -p $XRAY_PID --no-headers 2>/dev/null)"
          fi
        done
